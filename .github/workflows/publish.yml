name: Publish to npm

# 使用 npm Trusted Publishing（OIDC），无需 NPM_TOKEN。
# 需在 https://www.npmjs.com/package/@boailiu/nextmodel/access 配置 GitHub Actions 可信发布者：
#   boailiu / nextModel / publish.yml
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing 需要 npm >= 11.5.1
      - run: npm install -g npm@11
      - run: npm ci
      - id: check
        name: Skip if version already published
        run: |
          if npm view "$(node -p "require('./package.json').name")@$(node -p "require('./package.json').version")" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::This version is already on npm, skipping publish"
          fi
      - if: steps.check.outputs.published != 'true'
        run: npm publish --provenance
